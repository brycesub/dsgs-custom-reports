[tool.ruff]
target-version = "py312"
line-length = 100
# Plan/design docs are prose. Ruff 0.16+ formats Python blocks inside Markdown,
# which rewrites code samples in historical docs for no benefit.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
